<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Paletas</title>
    
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 class="mb-4">Buscador de Paletas de Colores</h1>
            
            <!-- Campo de entrada y botón de búsqueda -->
            <div class="input-group mb-3">
                <input type="text" id="inputBusqueda" class="form-control" placeholder="Escribe el nombre de la paleta...">
                <button class="btn btn-primary" id="btnBuscar">Buscar</button>
            </div>

            <!-- Botón de cambio de tema -->
            <button class="btn btn-outline-secondary btn-sm mb-3" id="btnCambiarTema">Cambiar Tema 🌓</button>

            <!-- Mensajes de estado -->
            <p id="textoMensaje" class="mt-2"></p>

            <!-- Resultados visuales -->
            <div id="resultadoPaleta" class="mt-4"></div>
        </div>
    </div>

    <!-- Script principal en módulo ES6 -->
    <script type="module" src="./funcion.mjs"></script>
</body>
</html>
