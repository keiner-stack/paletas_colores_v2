<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Paleta de Colores</title>
  <!-- Bootstrap CSS básico (Diapositiva 1) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="container py-4">

  <header class="mb-4 text-center">
    <h1 class="fw-bold">Generador de Paleta de Colores</h1>
  </header>

  <main>
    <section class="card p-4 shadow-sm mb-4">
      <label for="input-color" class="form-label fw-bold">Ingresa un color (ej. rojo, azul, o FF0000):</label>
      <div class="input-group mb-3">
        <input id="input-color" type="text" class="form-control" placeholder="Ej. rojo">
        <button id="btn-buscar" class="btn btn-primary" type="button">Buscar Paleta</button>
      </div>
      <p id="mensaje" class="fw-bold text-secondary"></p>
    </section>

    <section class="card p-4 shadow-sm">
      <h2 class="h5 mb-3">Resultados:</h2>
      <div id="contenedor-paleta" class="d-flex flex-wrap gap-3"></div>
    </section>
  </main>

  <script type="module" src="funcion.mjs"></script>
</body>
</html>
